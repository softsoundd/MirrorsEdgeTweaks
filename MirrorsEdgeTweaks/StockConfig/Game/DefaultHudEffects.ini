# Don't modify this file. If you do, your game may not start.
[TdGame.TdHudEffectManager]
;;
SpazzThrottle = 0.2
;;
;; On/Off-switches
bEnableUIPostProcessing=false;
bEnableHitEffect=true
bEnableHitEffectPP=true
bEnableHitEffectBlur=true
bEnableHitEffectCameraShake=true
bEnableHitEffectParticles=true
bEnableHealthEffect=true
bEnableFallDamageEffect=true
bEnableStreakEffect=true
bEnableReactionTimeEffect=true
bEnableDeathEffect=true
bEnableUncontrolledFallingEffect=true
;bEnableLaserEffect=true
bEnableSaturationEffect=true
;;
;; Health & Death effect
PPHealthSaturationSettings=(ParameterName="FXFScreen_HealthDesaturate", FadeInDuration=0.06, Duration=0.5, FadeOutDuration=0.5)
DeathEffectSpeed=0.25
;;
;; Streak effect
StreakDistanceInMovementDirection=120
StreakDistanceInCameraDirection=120
StreakEffectFadeTime=0.34f
;;
;; Uncontrolled falling
;; Some of this is clamped in code for PS3
UncontrolledFallingSpeedLimit=2000.0f
UncontrolledFallingEffectSpeed=0.5;
UncontrolledFallingEffectClamp=0.99f;
UncontrolledFallingEmitterOffset=(X=0,Y=0,Z=-200)
;;
;; ReactionTime
ReactionTimeTeaserTime=0.5f
;;
;; DOF Zoom settings
ZoomMaxFarBlurAmount = 0.9f
ZoomMaxNearBlurAmount = 0.6f
ZoomAutofocusSpeedUp = 3.0f
ZoomAutofocusSpeedDown = 4.5f
ZoomAutofocusMaxDistance = 20000.0f
;;
;; Debugflags
bDebugBlur=FALSE
bDebugHealth=FALSE
bDebugParticles=FALSE
bDebugTaserDamage=FALSE
bDebugStunDamage=FALSE
bDebugReactionTime=FALSE
bDebugUncontrolledFallingEffect=FALSE

[TdGame.TdHudEffect]
Blur=(FadeInDuration=0.2, Duration=0.7, FadeOutDuration=2.0, FocusDistance=-500, MaxFarBlurAmount=1.0)
PPStrength=(ParameterName="Strength", FadeInDuration=0.1, Duration=0.5, FadeOutDuration=1.5)
ParticleOrigin=(X=40.0f, Y=40.0f, Z=23.0f)
bDebugEffect=FALSE

