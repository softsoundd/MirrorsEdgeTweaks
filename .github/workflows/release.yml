name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The release step below would turn an existing release back into a draft and replace its download.
      - name: Stop if the tag already has a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $output = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            throw "A release for $env:GITHUB_REF_NAME already exists. Delete it, or push a new tag."
          }
          if ($output -notmatch 'release not found') {
            throw "Could not check for an existing release: $output"
          }
          exit 0

      # A beta tag such as 4.5.0-beta3 publishes the version it leads up to.
      - name: Stop if the tag does not match the app version
        shell: pwsh
        run: |
          [xml]$project = Get-Content MirrorsEdgeTweaks/MirrorsEdgeTweaks.csproj
          $version = @($project.Project.PropertyGroup | Where-Object { $_.Version } | ForEach-Object { $_.Version })[0]
          $tagVersion = $env:GITHUB_REF_NAME -replace '-.*$', ''
          if ($tagVersion -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in MirrorsEdgeTweaks.csproj."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (Release, warnings as errors)
        run: dotnet build MirrorsEdgeTweaks.slnx --configuration Release -warnaserror

      - name: Test
        run: dotnet test --solution MirrorsEdgeTweaks.slnx --configuration Release --no-build

      - name: Publish
        run: dotnet publish MirrorsEdgeTweaks/MirrorsEdgeTweaks.csproj --configuration Release -p:PublishProfile=FolderProfile --output publish

      - name: Package zip
        shell: pwsh
        run: |
          $extra = Get-ChildItem publish -Recurse -File | Where-Object Name -notin "Mirror's Edge Tweaks.exe", "Mirror's Edge Tweaks.pdb"
          if ($extra) {
            throw "The release zip would leave out: $($extra.Name -join ', ')"
          }
          $exe = "publish/Mirror's Edge Tweaks.exe"
          Compress-Archive -LiteralPath $exe -DestinationPath MirrorsEdgeTweaks.zip
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          "SHA-256 of Mirror's Edge Tweaks.exe: $hash" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Create GitHub release with asset
        uses: softprops/action-gh-release@v3
        with:
          files: MirrorsEdgeTweaks.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
